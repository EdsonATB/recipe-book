name: CI

on:
  push:
    branches:
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build

      - name: Tests
        run: dotnet test --settings tests/coverlet.runsettings --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Code Coverage Report
        run: |
          reportgenerator \
            "-reports:**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html"

      - name: Show Code Coverage
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          import os

          files = glob.glob("**/coverage.cobertura.xml", recursive=True)

          print("## Code Coverage")
          print()
          print("| Projeto | Line Coverage | Branch Coverage |")
          print("|---|---:|---:|")

          total_lines_covered = 0
          total_lines_valid = 0
          total_branches_covered = 0
          total_branches_valid = 0

          for file in files:
              root = ET.parse(file).getroot()

              line_rate = float(root.attrib.get("line-rate", 0)) * 100
              branch_rate = float(root.attrib.get("branch-rate", 0)) * 100

              lines_covered = int(root.attrib.get("lines-covered", 0))
              lines_valid = int(root.attrib.get("lines-valid", 0))

              branches_covered = int(root.attrib.get("branches-covered", 0))
              branches_valid = int(root.attrib.get("branches-valid", 0))

              # Tenta obter o nome do projeto pelo caminho do arquivo
              project_name = os.path.basename(
                  os.path.dirname(
                      os.path.dirname(file)
                  )
              )

              total_lines_covered += lines_covered
              total_lines_valid += lines_valid

              total_branches_covered += branches_covered
              total_branches_valid += branches_valid

              print(
                  f"| {project_name} | "
                  f"{line_rate:.2f}% | "
                  f"{branch_rate:.2f}% |"
              )

          if total_lines_valid:
              total_line_rate = (
                  total_lines_covered / total_lines_valid
              ) * 100
          else:
              total_line_rate = 0

          if total_branches_valid:
              total_branch_rate = (
                  total_branches_covered / total_branches_valid
              ) * 100
          else:
              total_branch_rate = 0

          print(
              f"| **Total** | "
              f"**{total_line_rate:.2f}%** | "
              f"**{total_branch_rate:.2f}%** |"
          )

          print()
          print(
              f"**Lines:** "
              f"{total_lines_covered}/{total_lines_valid}"
          )

          print(
              f"**Branches:** "
              f"{total_branches_covered}/{total_branches_valid}"
          )
          PY

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload Code Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: 'coverage-report'
